apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-github
  namespace: kubeflow
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "python:3.9-slim"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/examples/src/main/python/pi.py"
  sparkVersion: "3.4.1"

  # Spark Driver configuration
  driver:
    cores: 1
    memory: "512m"
    serviceAccount: spark
    labels:
      version: 3.4.1
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    env:
      - name: PYTHONHASHSEED
        value: "42"

  # Spark Executor configuration
  executor:
    cores: 1
    instances: 1
    memory: "512m"
    labels:
      version: 3.4.1
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

  # Optional: enable logging to see pod-level logs
  sparkConf:
    "spark.kubernetes.driver.log.level": "INFO"
    "spark.kubernetes.executor.log.level": "INFO"

  # Optional: tolerations / node selectors
  # tolerations:
  #   - key: "example-key"
  #     operator: "Exists"
  #     effect: "NoSchedule"
