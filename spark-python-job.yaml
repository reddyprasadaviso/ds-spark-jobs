apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-github
  namespace: kubeflow
  labels:
    app: spark
    team: ml
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "4040"
spec:
  type: Python
  mode: cluster
  image: gcr.io/spark-operator/spark-py:v3.1.1
  imagePullPolicy: Always
  mainApplicationFile: https://raw.githubusercontent.com/reddyprasadaviso/ds-spark-jobs/dev/pi.py
  sparkVersion: 3.1.1
  restartPolicy:
    type: Never
  sparkConf:
    "spark.driver.extraJavaOptions": "-Dlog4j.configuration=file:/opt/spark/conf/log4j.properties"
    "spark.executor.extraJavaOptions": "-Dlog4j.configuration=file:/opt/spark/conf/log4j.properties"
    "spark.dynamicAllocation.enabled": "true"
    "spark.shuffle.service.enabled": "true"
    "spark.executor.memoryOverhead": "128m"
  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark-operator-controller
    labels:
      version: v1
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
  executor:
    cores: 1
    instances: 2
    memory: 512m
    securityContext:
      runAsUser: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
